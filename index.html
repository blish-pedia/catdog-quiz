<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你的本命猫狗人格</title>
<style>
  :root{
    --bg:#f5f0e6;
    --paper:#fffdf8;
    --ink:#2b2620;
    --ink-soft:#6b6054;
    --line:#e7ddcc;
    --accent:#b8742f;
    --accent-soft:#f3e2cf;
    --shadow:0 10px 28px rgba(80,60,30,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer}

  .view{display:none}
  .view.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 起始页 */
  header.hero{padding:54px 0 26px;text-align:center}
  .hero .kicker{display:inline-block;font-size:13px;letter-spacing:.18em;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:var(--paper)}
  .hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;margin:18px 0 12px;letter-spacing:.02em}
  .hero p{color:var(--ink-soft);max-width:520px;margin:0 auto;font-size:15px}
  .start-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 28px;margin:24px auto;text-align:center}
  .start-card h2{font-size:21px;margin-bottom:10px}
  .start-card p{color:var(--ink-soft);font-size:15px;margin-bottom:24px}
  .big-btn{background:var(--ink);color:#fff;border:none;border-radius:14px;padding:15px 34px;font-size:16px;font-weight:600;transition:opacity .15s}
  .big-btn:hover{opacity:.88}
  .start-note{margin-top:16px;font-size:13px;color:var(--ink-soft)}

  /* 答题 */
  .quiz-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;margin:24px auto}
  .quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .quiz-progress .bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .quiz-progress .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .quiz-progress .count{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .question-title{font-size:18px;font-weight:700;margin-bottom:20px;min-height:54px}
  .options{display:grid;gap:12px}
  .option{display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fbf7f0;border:1px solid var(--line);border-radius:14px;padding:15px 16px;transition:border-color .15s,background .15s}
  .option:hover{border-color:var(--accent);background:#fff4e8}
  .option.picked{border-color:var(--accent);background:#fff4e8}
  .option .tag{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .option .text{font-size:15px;flex:1;min-width:0}
  .quiz-footer{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .quiz-tip{font-size:12px;color:var(--ink-soft)}
  .back-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);border-radius:12px;padding:9px 16px;font-size:13px;transition:border-color .15s,color .15s}
  .back-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .back-btn:disabled{opacity:.35;cursor:not-allowed}

  /* 结果 */
  .result-panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin:24px auto}
  .result-cover{position:relative;padding:34px 26px 28px;background:linear-gradient(150deg,#3a2c1c 0%,#6b4a26 55%,#8a6230 100%);color:#fff;overflow:hidden}
  .result-photo{position:absolute;top:0;right:0;height:100%;aspect-ratio:1/1;object-fit:contain}
  .result-cover .cover-text{position:relative;padding-right:166px}
  .result-cover::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
  .result-cover::after{content:"";position:absolute;left:-30px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06)}
  .result-type{position:relative;display:inline-block;font-size:12px;letter-spacing:.16em;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 14px;margin-bottom:14px}
  .result-name{position:relative;font-size:29px;font-weight:800;letter-spacing:.03em;margin-bottom:4px}
  .result-alias{position:relative;font-size:13.5px;color:rgba(255,255,255,.88)}
  .result-body{padding:24px 26px 28px}
  .result-kw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
  .result-kw span{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:600}

  .result-section{margin-top:20px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .section-head .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .section-head h3{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .result-section p{font-size:15px;color:#3d362d;line-height:1.8}
  .result-section p .em{color:var(--accent);font-weight:700}

  .quote{position:relative;background:#fbf3e7;border:1px solid var(--accent-soft);border-radius:18px;padding:20px 20px;margin-top:6px}
  .quote .mark{position:absolute;top:6px;left:16px;font-size:32px;color:var(--accent);opacity:.25;font-family:Georgia,serif;line-height:1}
  .quote-text{position:relative;font-size:17px;line-height:1.75;font-weight:600;color:#5a3d1e}

  .fit-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .fit-card{border-radius:16px;padding:15px 16px 13px}
  .fit-card.good{background:#f1f7f1;border:1px solid #d7e8d7}
  .fit-card.warn{background:#faf1ee;border:1px solid #f0d8d1}
  .fit-card .label{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin-bottom:7px}
  .fit-card.good .label{color:#3f7a52}
  .fit-card.warn .label{color:#a8543c}
  .fit-card .label::before{content:"";width:7px;height:7px;border-radius:50%}
  .fit-card.good .label::before{background:#3f7a52}
  .fit-card.warn .label::before{background:#a8543c}
  .fit-card .txt{font-size:14px;color:#3d362d;line-height:1.7}

  .compliance{margin-top:20px;font-size:12px;color:var(--ink-soft);line-height:1.6;border-top:1px dashed var(--line);padding-top:14px}
  .disclaimer{text-align:center;font-size:12px;color:var(--ink-soft);margin:18px 0 30px}

  @media (max-width:480px){
    .result-name{font-size:23px}
    .result-cover{padding:28px 20px 24px}
    .result-photo{height:100%;aspect-ratio:1/1;top:0;right:0;border-radius:0}
    .result-cover .cover-text{padding-right:126px}
    .result-body{padding:20px 18px}
    .fit-box{grid-template-columns:1fr}
    .quote-text{font-size:16px}
  }
</style>
</head>
<body>

<!-- ===== 起始视图 ===== -->
<section id="view-start" class="view active">
  <header class="hero wrap">

<section id="view-result" class="view">

            <div class="fit-card warn"><div class="label">不适合</div><div class="txt" id="resultWarn"></div></div>
          </div>
        </div>

        <p class="compliance" id="resultNote"></p>
      </div>
    </div>
    <p class="disclaimer">本测试为娱乐参考，性格结果不构成任何专业判断。</p>

</section>

      quote: "不高贵，但最靠得住；不精致，但最重情。",

/* ===== 独立加权计分键 =====
   每题选项对应一个倾向字母 A/B/C/D；
   每个品种在其主倾向题上得高分，在反向倾向题上扣分，其余为中性。
   KEYS[品种id] = 16 题各自的 [A,B,C,D] 分值数组。 */
const OPTION_IDX = { A: 0, B: 1, C: 2, D: 3 };

// 每品种在 16 题上的偏好选项：命中该题偏好 +3，未命中 0；按题独立分化
const QPREF = {
  // A 陪伴粘人型
  ragdoll:    ["A","A","A","A","A","A","A","A","A","A","A","A","A","A","A","A"],
  bluewhite:  ["A","C","B","A","A","C","A","C","A","C","C","A","A","A","A","A"],
  siamese:    ["A","C","A","A","A","A","A","A","A","A","A","A","A","A","A","A"],
  sphynx:     ["A","C","A","A","C","A","C","A","A","C","C","A","A","A","A","A"],
  samoyed:    ["A","C","A","C","A","C","C","C","A","C","C","A","A","C","A","A"],
  golden:     ["A","A","B","A","A","A","A","A","A","A","A","A","A","A","A","A"],
  labrador:   ["A","C","A","A","C","A","C","A","A","C","C","A","A","C","A","A"],
  bichon:     ["A","D","A","A","A","A","A","A","A","A","D","A","A","A","A","A"],
  poodle:     ["A","C","A","A","A","A","C","C","A","C","C","A","A","C","A","A"],
  // B 独立领地型
  goldenshade:["D","B","B","B","B","B","B","D","B","B","B","B","B","B","D","B"],
  silvershade:["B","B","D","B","B","B","B","B","B","B","B","B","B","B","B","B"],
  lihua:      ["B","B","B","C","B","B","B","B","B","C","B","B","B","B","B","B"],
  chinchilla: ["D","B","B","B","B","B","B","B","B","B","B","B","D","B","B","B"],
  calico:     ["B","C","B","B","C","B","C","B","B","C","B","B","B","B","B","B"],
  blackcat:   ["B","B","B","B","B","D","B","B","B","B","D","B","B","B","B","B"],
  shiba:      ["B","B","B","B","B","B","B","D","B","B","B","B","B","B","B","D"],
  akita:      ["B","D","B","B","B","B","B","B","B","B","B","B","D","B","B","B"],
  schnauzer:  ["B","C","B","B","B","B","C","B","B","C","B","B","B","B","B","B"],
  // C 高能探索型
  americansh: ["D","B","B","D","D","D","B","D","D","B","D","D","D","B","D","D"],
  maine:      ["A","C","B","C","C","A","C","A","A","C","C","C","A","C","A","C"],
  cowcat:     ["C","C","C","C","C","D","C","C","C","C","C","C","C","C","C","C"],
  bcollie:    ["C","C","B","C","C","C","C","C","C","C","B","C","C","C","C","C"],
  husky:      ["C","C","C","D","C","C","C","C","C","D","C","C","C","D","C","C"],
  corgi:      ["C","D","B","C","C","D","C","D","C","C","D","C","C","C","D","C"],
  pom:        ["C","C","C","C","A","C","C","C","C","C","C","C","A","C","C","A"],
  gshepherd:  ["B","C","B","B","B","C","C","B","B","C","B","B","B","B","C","B"],
  malamute:   ["A","B","B","B","C","A","C","B","A","B","C","B","A","B","A","B"],

  blue:       ["D","D","D","D","D","D","D","D","D","D","D","D","D","D","D","D"],
  fold:       ["A","D","D","A","D","A","D","D","A","D","D","D","A","D","A","D"],
  exotic:     ["D","D","A","D","D","D","D","D","D","D","D","A","D","D","D","D"],
  persian:    ["D","B","D","D","B","D","D","B","D","B","D","D","D","B","D","D"],
  orange:     ["D","D","D","A","D","D","D","D","D","D","A","D","D","D","D","A"],
  frenchie:   ["A","B","D","D","D","A","D","B","D","B","D","D","A","D","B","D"],
  chow:       ["D","B","B","D","B","D","B","D","D","B","B","D","D","B","D","B"],
  yorkie:     ["A","C","A","C","A","A","C","A","A","C","A","A","A","C","C","A"],
  native:     ["A","D","B","B","B","A","B","B","A","B","D","B","A","B","A","B"]
};

// 主型在各题上的基线：主倾向 +2，次倾向 +1，其余 -1
const BASE = {
  A: [2, 2, 1, 1, 2, 2, 1, 2, 2, 2, 1, 2, 2, 2, 2, 2],
  B: [0, 2, 2, 2, 0, 0, 2, 1, 1, 2, 2, 1, 1, 2, 2, 1],
  C: [0, 2, 1, 2, 2, 1, 2, 2, 2, 2, 2, 2, 2, 2, 1, 1],
  D: [2, 1, 0, 0, 0, 2, 0, 1, 2, 0, 0, 2, 1, 0, 2, 2]
};

const KEYS = {};
RESULTS.forEach(r => {
  const pref = QPREF[r.id] || [];
  KEYS[r.id] = QUESTIONS.map((_, qi) => {
    const main = r.type;
    const baseRow = BASE[main];
    const row = [0, 0, 0, 0];
    ["A", "B", "C", "D"].forEach((letter, idx) => {
      let score = baseRow[qi];
      if (letter !== main) score = score > 0 ? 0 : -1;
      // 品种个性化偏好：命中该题偏好额外 +3，未命中偏好的选项适度减分
      if (pref[qi] === letter) score += 3;
      else score -= 1;
      row[idx] = score;
    });
    return row;
  });
});

let answers = [];
let current = 0;

function show(viewId) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(viewId).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startQuiz() {
  answers = [];
  current = 0;
  show("view-quiz");
  renderQuestion();
}

function renderQuestion() {
  const item = QUESTIONS[current];
  const total = QUESTIONS.length;
  document.getElementById("progressCount").textContent = "第 " + (current + 1) + " 题 / 共 " + total + " 题";
  document.getElementById("progressFill").style.width = ((current) / total * 100) + "%";
  document.getElementById("questionTitle").textContent = item.q;

  const list = document.getElementById("optionList");
  list.innerHTML = "";
  item.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    if (answers[current] === opt.k) btn.classList.add("picked");
    btn.innerHTML = '<span class="tag">' + opt.k + '</span><span class="text">' + opt.t + "</span>";
    btn.onclick = () => pick(opt.k);
    list.appendChild(btn);
  });

  document.getElementById("backBtn").disabled = (current === 0);
}

function pick(key) {
  answers[current] = key;
  const total = QUESTIONS.length;
  if (current < total - 1) {
    current++;
    renderQuestion();
  } else {
    document.getElementById("progressFill").style.width = "100%";
    setTimeout(showResult, 260);
  }
}

function goBack() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function computeResult() {
  let best = RESULTS[0];
  let bestScore = -Infinity;
  RESULTS.forEach(r => {
    let score = 0;
    KEYS[r.id].forEach((row, qi) => {
      const ans = answers[qi];
      if (ans !== undefined) score += row[OPTION_IDX[ans]];
    });
    if (score > bestScore) { bestScore = score; best = r; }
  });
  return { main: best.type, hit: best, score: bestScore };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function highlight(desc, kw) {
  let html = escapeHtml(desc);
  kw.forEach(k => {
    if (!k) return;
    html = html.split(escapeHtml(k)).join('<span class="em">' + escapeHtml(k) + "</span>");
  });
  return html;
}

function showResult() {
  const { main, hit: r } = computeResult();

  const photo = document.getElementById("resultImg");
  const imgSrc = IMG_MAP[r.id];
  if (imgSrc) {
    photo.src = imgSrc;
    photo.alt = r.name;
    photo.style.display = "block";
    photo.onerror = () => { photo.style.display = "none"; };
  } else {
    photo.style.display = "none";
  }

  document.getElementById("resultType").textContent = TYPE_NAME[main];
  document.getElementById("resultName").textContent = r.name;
  document.getElementById("resultAlias").textContent = r.alias;
  document.getElementById("resultDesc").innerHTML = highlight(r.desc, r.kw);
  document.getElementById("resultQuote").textContent = r.quote;
  document.getElementById("resultFit").textContent = r.fit;
  document.getElementById("resultWarn").textContent = r.warn;
  document.getElementById("resultNote").textContent = r.note;

  const kwBox = document.getElementById("resultKw");
  kwBox.innerHTML = "";
  r.kw.forEach(k => {
    const s = document.createElement("span");
    s.textContent = k;
    kwBox.appendChild(s);
  });

  show("view-result");
}
</script>
